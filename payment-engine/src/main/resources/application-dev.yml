    username: ${DB_USERNAME:mobidevdbadmin}
    password: ${DB_PASSWORD:M081D@V3@dm!N87}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update    # fail fast if schema differs; never auto-create/alter tables
      naming:
        # Keep @Table/@Column names exactly as declared (no snake_case/lowercase conversion)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

