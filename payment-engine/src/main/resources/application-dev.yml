spring:
  datasource:
    url: ${UNIFIED_DATASOURCE_URL:jdbc:mysql://13.218.125.13:3306/unified_v1?useUnicode=true&characterEncoding=UTF-8&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}
    username: ${UNIFIED_DATASOURCE_USERNAME:mobidev}
    password: ${UNIFIED_DATASOURCE_PASSWORD:mobi@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  sql:
    init:
      mode: always                                          # run schema + data scripts on every startup
      schema-locations: classpath:db/unified_payments_schema_v5.sql
      continue-on-error: true                               # skip statements that already exist (e.g. duplicate inserts)

  jpa:
    hibernate:
      ddl-auto: none    # schema is managed by the SQL init script above
      naming:
        # Keep @Table/@Column names exactly as declared (no snake_case/lowercase conversion)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    defer-datasource-initialization: true   # ensure SQL scripts run before Hibernate validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    io.gomobi.payment: DEBUG
#    org.hibernate.SQL: INFO

